name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore AIsteriaAggregator.sln

    - name: Build
      run: dotnet build AIsteriaAggregator.sln -c Release --no-restore

    - name: Test
      run: dotnet test AIsteriaAggregator.sln -c Release --no-build

    - name: Publish net6.0
      run: dotnet publish Aisteria/Aisteria.csproj -c Release -o out/net6.0-windows -f net6.0-windows

    - name: Publish net9.0
      run: dotnet publish Aisteria/Aisteria.csproj -c Release -o out/net9.0-windows -f net9.0-windows

    - name: Publish net10.0
      run: dotnet publish Aisteria/Aisteria.csproj -c Release -o out/net10.0-windows -f net10.0-windows

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReleaseBuild
        path: out
